<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exercício sobre seletores de classe no CSS.">
    <title>Lição 21 — Seletores de classe</title>
    <style>
        body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; font-family: Georgia, serif; line-height: 1.6; }
        .card { margin: 1.5rem 0; padding: 1.25rem; border-radius: .625rem; box-shadow: 0 2px 8px rgb(0 0 0 / 15%); }
        .success { background: #ecfdf5; border-left: 7px solid #16a34a; }
        .alert { background: #fef2f2; border-left: 7px solid #dc2626; }
        .info { background: #eff6ff; border-left: 7px solid #2563eb; }
    </style>
</head>
<body>
    <main>
        <h1>Seletores CSS de classe</h1>
        <section class="card success"><h2>Reutilização de estilos</h2><p>Classes são identificadas por um ponto no CSS e podem ser compartilhadas entre vários elementos HTML.</p></section>
        <section class="card alert"><p>A classe <code>alert</code> cria uma variação de destaque em vermelho.</p></section>
        <section class="card info"><p>A classe <code>info</code> cria uma variação de destaque em azul.</p></section>
    </main>
</body>
</html>
