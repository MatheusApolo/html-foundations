<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lição 17 | Cadastro pessoal</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <header>
        <a class="back-link" href="../index.html">← Voltar às lições</a>
        <h1>Cadastro pessoal</h1>
        <p class="lead">Exercício de formulário com dados pessoais e preferências de estudo.</p>
    </header>
    <main>
        <form class="example" action="#" method="post">
            <fieldset>
                <legend>Cadastro pessoal</legend>
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Digite seu nome completo" required>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>

                <label for="ano-nascimento">Ano de nascimento</label>
                <input id="ano-nascimento" name="ano_nascimento" type="number" min="1900" max="2026">

                <label for="data-nascimento">Data de nascimento</label>
                <input id="data-nascimento" name="data_nascimento" type="date" autocomplete="bday">

                <label for="horario-estudo">Horário preferido de estudo</label>
                <input id="horario-estudo" name="horario_estudo" type="time">
            </fieldset>
            <button type="submit">Enviar</button>
        </form>
    </main>
    <footer>Lição 17 de 19.</footer>
</body>
</html>
