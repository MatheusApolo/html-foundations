<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lição 12 | Formulário POST</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <header>
        <a class="back-link" href="../index.html">← Voltar às lições</a>
        <h1>Formulário com método POST</h1>
        <p class="lead">Os campos são enviados no corpo da requisição, não na URL.</p>
    </header>
    <main>
        <form class="example" action="/register" method="post">
            <label for="name">Nome</label>
            <input id="name" name="name" type="text" autocomplete="name" required>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

            <button type="submit">Cadastrar</button>
        </form>
        <p class="note">
            Exemplo acadêmico: o método POST não substitui HTTPS, validação no servidor ou armazenamento seguro.
        </p>
    </main>
    <footer>Lição 12 de 12.</footer>
</body>
</html>
