    <style>

    <main>
        <h1 id="page-title">Seletores CSS de ID</h1>
        <section id="explanation"><h2 id="topic-title">Uso específico</h2><p>Seletores de ID são representados por <code>#</code> no CSS e se aplicam ao elemento com aquele identificador único.</p></section>
        <section id="example"><p>Por serem únicos na página, IDs devem ser usados com intenção. Para estilos reutilizáveis, classes costumam ser mais adequadas.</p></section>
