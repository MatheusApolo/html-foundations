            <h2>Exemplos</h2>

            <p><em>Em</em> acrescenta ênfase ao trecho.</p>
            <p><mark>Mark</mark> destaca uma parte relevante no contexto atual.</p>
            <p><small>Small</small> representa uma observação secundária.</p>
